name: Deploy Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Checkout private Docboard dependency
        env:
          DOCBOARD_REPO_TOKEN: ${{ secrets.DOCBOARD_REPO_TOKEN }}
        run: |
          if [ -z "$DOCBOARD_REPO_TOKEN" ]; then
            echo "DOCBOARD_REPO_TOKEN is missing or empty"
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${DOCBOARD_REPO_TOKEN}@github.com/gabrielwawerski/docboard.git" \
            ../Docboard

      - name: Configure git to use HTTPS
        run: |
          git config --global url."https://x-access-token:${DOCBOARD_REPO_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${DOCBOARD_REPO_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          DOCBOARD_REPO_TOKEN: ${{ secrets.DOCBOARD_REPO_TOKEN }}

      - name: Install dependencies
        run: npm ci
        env:
          DOCBOARD_REPO_TOKEN: ${{ secrets.DOCBOARD_REPO_TOKEN }}

      - name: Install Docboard dependencies
        working-directory: ../Docboard
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build docs
        run: npm run docs:build
        env:
          NODE_OPTIONS: --preserve-symlinks

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
