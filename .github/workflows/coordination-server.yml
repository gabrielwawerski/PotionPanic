name: Coordination Server

on:
  pull_request:
    paths:
      - 'Tools/CoordinationServer/**'
      - '.github/workflows/coordination-server.yml'
  push:
    branches:
      - master
    paths:
      - 'Tools/CoordinationServer/**'
      - '.github/workflows/coordination-server.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tools/CoordinationServer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tools/CoordinationServer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run
