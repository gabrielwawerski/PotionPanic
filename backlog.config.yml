project_name: "PotionPanic"
default_status: "Backlog"
statuses: [ "Backlog", "To Do", "Doing", "Test / Review", "Done" ]
labels: []
definition_of_done: [ "Acceptance criteria met", "Relevant Unity verification completed", "No new relevant Console errors", "Documentation or Backlog notes updated when needed", "Branch committed and ready for review or merge" ]
date_format: dd/mm/yyyy
max_column_width: 32
default_editor: "rider"
auto_open_browser: false
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: true
check_active_branches: true
active_branch_days: 10
task_prefix: "PP"
backlog_directory: "backlog"
